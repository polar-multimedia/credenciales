es canciones; Guadalajara, Monterrey y CDMX. Top Gin Resident 2026: 48 residentes, 14 estados, 21 hospitales, tres días en una hacienda minera. Con estas obras Adium ganó 4 oros en los 28 WHA 2026. Cada tarjeta tiene botón para ver el caso completo."},{id:"quienes",ch:"Apertura",t:"Quiénes somos",n:4,C:hF,notes:"Treinta segundos. Tres líneas que se contratan juntas o por separado. Para OTC, el orden es contenido, tecnología y experiencias."},{id:"reto",ch:"Contenido",t:"El reto de una marca OTC",n:4,C:vF,notes:"Pregúntales cuál de los cuatro frentes les duele más hoy. Lo que respondan decide en qué parte te detienes. Redes y cumplimiento: la línea de contenido. Mostrador: Munins Chat, Dr. G y el hub. IA: Munins."},{id:"linea",ch:"Contenido",t:"La línea que fabrica la campaña",n:6,C:yF,notes:"Ecosistema C-Tech para Carnot (calcio, salud ósea femenina; no compite con Adium OTC). Radar: un hallazgo de siete fuentes cerradas (IOF, NAMS, PubMed, IMSS, Medigraphic, Scielo México y AMMOM). Redacción: el mismo hecho escrito para cada medio. Producción: de 6 a 12 piezas con arte por hallazgo. Aprobación: filtro regulatorio de todo el lote y aprobación quincenal del cliente. Lo replicable es la línea."},{id:"album",ch:"Contenido",t:"Álbum real de noviembre",n:0,C:xF,notes:"Las 18 piezas reales de noviembre de C-Tech: 6 reels, 5 posts, 3 carruseles y 4 stories. Toca cualquiera para abrirla; los reels suenan. Filtros por formato. Dentro del álbum las flechas cambian de pieza y Esc lo cierra. Señala el legal de Cofepris en cada pieza."},{id:"estudio",ch:"Contenido",t:"Estudio propio",n:5,C:bF,notes:"Estudio propio en Montecito 38, World Trade Center. Todo lo que vieron en el álbum de noviembre se produjo en casa."},{id:"debajo",ch:"Mostrador",t:"Corpus, criterio y control",n:3,C:CF,notes:"Tres preguntas para evaluar cualquier agente de IA, incluido el nuestro: con qué información trabaja, quién decide y quién revisa antes de que salga. En OTC importa el doble, porque el agente habla con el consumidor."},{id:"antena",ch:"Mostrador",t:"Munins Chat",n:4,C:SF,notes:"Munins Chat está disponible en piloto: dilo así. Agentes conversacionales para farmacias, distribuidores y pacientes, solo con información aprobada y con reglas de escalamiento. El punto que más pesa en farma: un posible evento adverso pasa de inmediato a una persona y a farmacovigilancia."},{id:"clara",ch:"Mostrador",t:"Dra. Clara Laguardia",n:4,C:EF,notes:"Dra. Clara Laguardia, agente de evidencia para médicos (versión demo sin marca). Conversa en voz y, cuando la pregunta es científica, busca solo en los estudios que aprobó el laboratorio y muestra la fuente. Si el dato no está, lo dice. Para OTC: el mismo principio sirve para responderle al médico que recomienda una marca de venta libre, o al farmacéutico. Pide permiso del micrófono la primera vez; prueba la conexión antes de la junta."},{id:"drg",ch:"Mostrador",t:"Dr. G, simulador de voz",n:5,C:kF,notes:"Dr. G es el simulador de visita médica en operación para una fuerza de ventas. Para la demo, elige Escéptico; pide permiso de micrófono la primera vez. Prueba la conexión antes de la junta. La adaptación al dependiente de farmacia es una propuesta, no un proyecto hecho: dilo así."},{id:"hub",ch:"Mostrador",t:"Artic Hubs",n:4,C:PF,notes:"Artic Hubs es la versión demo, con marcas y datos ficticios, del hub que opera una fuerza de ventas. El teléfono es navegable. Las cifras son de proyectos en operación."},{id:"munins",ch:"La IA",t:"Munins, visibilidad en IA",n:4,C:RF,notes:"Munins está disponible en piloto. Nace del trabajo de Polar en visibilidad para motores de IA con equipos de marketing del sector salud. Esta lámina prepara el cierre: el diagnóstico sin costo es el primer paso de Munins."},{id:"exp",ch:"Experiencias",t:"Experiencias en vivo",n:2,C:NF,notes:"Una sola lámina de eventos y stands. Si les interesa, abre cualquiera de los cuatro casos; si no, sigue. Los seis de abajo son stands y montajes del archivo."},{id:"ventajas",ch:"Cierre",t:"Ventajas Polar",n:4,C:FF,notes:"Valida antes de la junta las condiciones comerciales que quieras comprometer."},{id:"premios",ch:"Cierre",t:"Premios",n:3,C:jF,notes:"Temporada 2026: 11 reconocimientos. Aspid Latam 2026: Mejor Audiovisual para El Rostro Invisible, Oro en Formación Médica para El Partido de la Evidencia y Aspid a Mejor Formación de Fuerza de Ventas para Strategy Hub. 28 WHA 2026: con obras de Polar, Adium ganó 4 oros y Carnot 1 oro y 3 platas. Trayectoria Aspid Latam 2020–2026: 12 oros, 2 platas y 8 Aspid, 22 en total."},{id:"cierre",ch:"Cierre",t:"Diagnóstico sin costo",n:4,C:LF,notes:"Cierra con la oferta: un diagnóstico sin costo de cómo aparecen dos o tres marcas de Adium OTC en las respuestas de la IA. Pide que elijan las marcas ahí mismo y acuerda la fecha de la reunión para presentar el hallazgo."}];let Uf=0;const Nt=AF.map((e,t)=>{const n=uF(e.n),r=Uf;return Uf+=n,{...e,i:t,start:r,dur:n,stops:lF(e.n).map(o=>r+o)}}),_F=Uf+yu,en=Nt.flatMap(e=>e.stops.map((t,n)=>({f:t,slide:e.i,step:n}))),OF=({ui:e})=>d.jsx(fb.Provider,{value:e,children:d.jsx(vi,{className:"deck",children:Nt.map(t=>d.jsx(gt,{from:t.start,durationInFrames:t.dur+yu,name:t.t,children:d.jsx(oh.Provider,{value:{dur:t.dur},children:d.jsx(t.C,{})})},t.id))})}),$F={Apertura:"Quiénes somos",Contenido:"Contenido todo el año",Mostrador:"Farmacia y mostrador","La IA":"La IA como canal",Experiencias:"Experiencias",Cierre:"Ventajas, premios y siguiente paso"},zg=e=>{let t=0;return en.forEach((n,r)=>{n.f<=e&&(t=r)}),t},DF=()=>{const e=u.useRef(null),t=u.useRef(null),[n,r]=u.useState(0),[o,i]=u.useState(!1),[s,a]=u.useState(null),[l,c]=u.useState(null),[f,m]=u.useState(null),[p,v]=u.useState(!1),[x,w]=u.useState(!1),S=u.useRef(null),g=!!(s||l||f),h=en[n],y=Nt[h.slide],b=u.useMemo(()=>{const R=parseInt(location.hash.slice(1),10);return R>=1&&R<=Nt.length?Nt[R-1].stops[0]:en[0].f},[]);u.useEffect(()=>{let R=0;const E=()=>{++R>=Math.min($g.length,20)&&v(!0)};$g.forEach(A=>{con
